[project]
name = "personal-ai-trainer-backend"
version = "0.1.0"
description = "Backend (FastAPI) for the Personal AI Running Coach"
authors = [
    { name = "Samuel Ringl", email = "samuel.ringl@student.tugraz.at" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
